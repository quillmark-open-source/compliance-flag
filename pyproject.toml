[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "compliance-flag"
dynamic = ["version"]
description = "AI-assisted Python CLI for drafting SEC Marketing Rule review reports with Anthropic's Opus model."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Quillmark LLC" }
]
maintainers = [
  { name = "Quillmark LLC" }
]
keywords = [
  "sec",
  "investment-advisers",
  "marketing-rule",
  "compliance",
  "cli"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Text Processing :: Markup :: HTML"
]
dependencies = [
  "anthropic>=0.77.0",
  "beautifulsoup4>=4.12.0",
  "httpx>=0.27.0",
  "idna>=3.0",
  "jsonschema[format-nongpl]>=4.22.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
  "twine>=5.1.0"
]

[project.scripts]
compliance-flag = "compliance_flag.cli:main"

[project.urls]
Homepage = "https://complianceflag.com/"
Documentation = "https://complianceflag.com/docs/"
Issues = "https://github.com/quillmark-open-source/compliance-flag/issues"
Source = "https://github.com/quillmark-open-source/compliance-flag"

[tool.hatch.version]
path = "src/compliance_flag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_flag"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/DISCLAIMER.md",
  "/AGENTS.md",
  "/pyproject.toml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]

[tool.mypy]
ignore_missing_imports = true
